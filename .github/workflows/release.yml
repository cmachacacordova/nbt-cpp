name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    name: Build and test (Windows)
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4'
          runVcpkgInstall: true

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DNBT_CPP_BUILD_TESTS=ON
          -DNBT_CPP_BUILD_EXAMPLES=OFF

      - name: Build
        shell: bash
        run: cmake --build build --config Release

      - name: Test
        shell: bash
        run: ctest --test-dir build -C Release --output-on-failure

  build-linux:
    name: Build and test (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@v11
        with:
          vcpkgGitCommitId: '04a9d8e5212d01ee1dd9478eadd9caade4f8b0d4'
          runVcpkgInstall: true

      - name: Configure
        shell: bash
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE="$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          -DCMAKE_BUILD_TYPE=Release
          -DNBT_CPP_BUILD_TESTS=ON
          -DNBT_CPP_BUILD_EXAMPLES=OFF

      - name: Build
        shell: bash
        run: cmake --build build

      - name: Test
        shell: bash
        run: ctest --test-dir build --output-on-failure

  release:
    name: Create release package
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create source package
        shell: bash
        run: |
          pkg="nbt-cpp-${{ github.ref_name }}"
          mkdir -p "$pkg"
          cp -r CMakeLists.txt cmake include src vcpkg.json LICENSE README.md docs "$pkg/"
          tar -czf "$pkg-src.tar.gz" "$pkg"
          rm -rf "$pkg"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: nbt-cpp-*.tar.gz
          draft: false
          generate_release_notes: true
